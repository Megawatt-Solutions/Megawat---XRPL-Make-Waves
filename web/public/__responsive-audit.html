<!doctype html>
<meta charset="utf-8">
<title>responsive audit (throwaway)</title>
<style>
  body { margin:0; background:#111; color:#ccc; font:12px/1.5 system-ui; }
  #stage { border:1px solid #444; background:#000; display:block; }
  #hud { padding:8px; font-family:ui-monospace,monospace; }
</style>
<div id="hud">idle</div>
<iframe id="stage" src="about:blank" width="360" height="760"></iframe>
<script>
// Statistically common viewport widths (2026 global mix): Android baseline,
// the iPhone cluster, tablets in both orientations, and the laptop/desktop
// modes that dominate desktop traffic.
const WIDTHS = [320, 360, 390, 414, 430, 768, 820, 1024, 1280, 1440, 1920];
const HEIGHTS = { 320:658, 360:800, 390:844, 414:896, 430:932, 768:1024, 820:1180, 1024:768, 1280:800, 1440:900, 1920:1080 };
const ROUTES = [
  "/", "/dashboard-v2", "/portfolio", "/marketplace",
  "/vault/bess-ljubljana-01",
  "/spreadcast", "/spreadcast/board", "/spreadcast/log", "/spreadcast/how",
];

const stage = document.getElementById("stage");
const hud = document.getElementById("hud");

function load(url, w, h) {
  return new Promise((resolve) => {
    stage.width = w; stage.height = h;
    stage.onload = () => setTimeout(resolve, 850); // let data land + layout settle
    stage.src = url;
  });
}

// ── Overlays ────────────────────────────────────────────────────────────
// Every check here used to run against a route with everything closed, so
// sheets, modals and the onboarding flow were never audited at all — and one
// of them was carrying a live contrast failure the whole time. --sheet and
// --toast are the two lightest surfaces in the app and neither is reachable
// without opening something.
//
// Each entry names a control to click and what should appear. Missing controls
// are skipped silently: they are state-dependent (the connect modal only
// exists when no wallet is attached) and a hard failure would make the audit
// depend on demo data.
const OVERLAYS = [
  { route: "/spreadcast", open: ".sc-commit-why", expect: "[role=dialog]", name: "sheet:provably-fair" },
  { route: "/?onboarding=1", open: null, expect: ".ob-sheet", name: "onboarding" },
  { route: "/", open: ".wallet-pill", expect: "[role=dialog], .overlay", name: "wallet" },
  { route: "/marketplace", open: ".btn-accent", expect: "[role=dialog], .overlay", name: "sell" },
];

// ── User font-size preference ────────────────────────────────────────────
// Browser zoom scales everything including px, so a px-only stylesheet still
// "works" under zoom. What it ignores is the OTHER control: a raised default
// font size, which only rem/em type responds to. Users who need larger text
// and reach for that setting rather than zoom get nothing at all.
//
// Two things are checked, because a migration to rem can fail in both
// directions: type that still does not respond, and type that responds so
// enthusiastically it overflows a fixed-height box.
async function auditTextScale(routes, width) {
  const findings = [];
  for (const route of routes) {
    await load("http://localhost:3000" + route, width, 900);
    const d = stage.contentDocument, win = stage.contentWindow;
    const sample = () => [...d.querySelectorAll("p, h1, h2, .btn, .page-sub, .tile-sub, .bottom-nav-item")]
      .slice(0, 25).map((el) => parseFloat(win.getComputedStyle(el).fontSize));
    const before = sample();

    d.documentElement.style.fontSize = "24px"; // a common large-text setting
    await new Promise((r) => setTimeout(r, 350));
    const after = sample();
    const responded = after.filter((v, i) => v > before[i] + 0.5).length;

    // Text that the larger size pushes out of a box that actually CLIPS.
    //
    // The first version of this filtered FOR overflow:visible, which is exactly
    // where content does not get clipped — it just paints outside its box. It
    // duly reported two elements that render perfectly well. Clipping needs
    // hidden/clip/scroll/auto; visible is the one value that cannot clip.
    //
    // Compared against the same measurement at the default root size, so
    // pre-existing overflow is not attributed to the text scale.
    const clipsNow = () => new Set(
      [...d.querySelectorAll("body *")].filter((el) => {
        const s = win.getComputedStyle(el);
        const clips = /hidden|clip|scroll|auto/.test(s.overflowY) || /hidden|clip/.test(s.overflow);
        return clips && el.clientHeight > 0 && el.scrollHeight > el.clientHeight + 2;
      }).map(describe)
    );
    const clippedScaled = clipsNow();
    const docOverflow = d.documentElement.scrollWidth > win.innerWidth + 1;

    d.documentElement.style.fontSize = "";
    await new Promise((r) => setTimeout(r, 250));
    const clippedBase = clipsNow();

    if (before.length && responded === 0) {
      findings.push({ route: `${route} (text scale)`, w: width, kind: "text-ignores-user-font-size",
        detail: `0 of ${before.length} sampled elements responded to a 24px root` });
    }
    for (const el of clippedScaled) {
      if (clippedBase.has(el)) continue; // already clipped before scaling; not this check's finding
      findings.push({ route: `${route} (text scale)`, w: width, kind: "fixed-box-clips-scaled-text", el });
    }
    if (docOverflow) {
      findings.push({ route: `${route} (text scale)`, w: width, kind: "scaled-text-overflows-page",
        detail: `${d.documentElement.scrollWidth} > ${win.innerWidth}` });
    }
  }
  return findings;
}

// ── Short viewports ──────────────────────────────────────────────────────
// Every width in WIDTHS is audited at 800–900px tall, so a rotated phone —
// about 390px — was never seen. That is where fixed chrome stops being a
// detail: nav + section bar + tab bar took 45% of the screen on /spreadcast
// before this was measured.
const LANDSCAPE = [
  [844, 390, "iPhone landscape"],
  [740, 360, "small Android landscape"],
];

async function auditShortViewports(routes) {
  const findings = [];
  for (const [w, h, name] of LANDSCAPE) {
    for (const route of routes) {
      await load("http://localhost:3000" + route, w, h);
      const d = stage.contentDocument, win = stage.contentWindow;
      const tag = (f) => findings.push({ route: `${route} (${name})`, w, ...f });
      try { for (const f of audit(w)) tag(f); } catch (e) { /* keep going */ }

      // Chrome that never scrolls away. Anything past a third of a short
      // screen means the page is being read through a letterbox.
      const box = (sel) => {
        const el = d.querySelector(sel);
        if (!el) return 0;
        const pos = win.getComputedStyle(el).position;
        if (pos !== "fixed" && pos !== "sticky") return 0;
        return el.getBoundingClientRect().height;
      };
      const chrome = box(".nav") + box(".sc-bar") + box(".bottom-nav");
      const pct = Math.round((chrome / win.innerHeight) * 100);
      if (pct > 33) {
        tag({ kind: "chrome-eats-short-viewport", el: "nav+bar+tabs",
              detail: `${Math.round(chrome)}px of ${win.innerHeight} = ${pct}%` });
      }
    }
  }
  return findings;
}

async function auditOverlays(width) {
  const findings = [];
  for (const o of OVERLAYS) {
    await load("http://localhost:3000" + o.route, width, 844);
    const d = stage.contentDocument;
    if (o.open) {
      const btn = d.querySelector(o.open);
      if (!btn) continue; // state-dependent; not a failure
      btn.click();
      await new Promise((r) => setTimeout(r, 700));
    }
    if (!d.querySelector(o.expect)) continue;
    const tag = (f) => findings.push({ route: `${o.route} (${o.name})`, w: width, ...f });
    try { for (const f of contrast()) tag(f); } catch (e) { /* keep going */ }
    try { for (const f of audit(width)) tag(f); } catch (e) { /* keep going */ }
    // Semantics too: an overlay is exactly where an unlabelled icon button or
    // an unlabelled field hides, and it is also where getting it wrong costs
    // most — a dialog you cannot name is a dialog you cannot leave.
    try {
      for (const f of await semantics()) {
        if (f.kind === "no-h1" || f.kind === "heading-level-skipped") continue; // page-level, not the overlay's
        tag(f);
      }
    } catch (e) { /* keep going */ }
    // An overlay that reaches past the viewport bottom cannot be finished.
    const panel = d.querySelector(o.expect);
    const r = panel.getBoundingClientRect();
    if (r.height > stage.contentWindow.innerHeight + 1) {
      tag({ kind: "overlay-taller-than-viewport", el: o.name,
            detail: `${Math.round(r.height)} > ${stage.contentWindow.innerHeight}` });
    }
  }
  return findings;
}

// True when some ancestor is an intentional horizontal scroller. Content
// inside one is *supposed* to exceed the viewport, so flagging it is noise.
function inScroller(el, root) {
  for (let p = el.parentElement; p && p !== root; p = p.parentElement) {
    const ox = getComputedStyle(p).overflowX;
    if (ox === "auto" || ox === "scroll") return true;
  }
  return false;
}

function describe(el) {
  const c = typeof el.className === "string" ? el.className.trim().split(/\s+/).slice(0,2).join(".") : "";
  return (c ? "." + c : el.tagName.toLowerCase()) + (el.id ? "#" + el.id : "");
}

// One viewport's worth of checks.
function audit(w) {
  const d = stage.contentDocument, win = stage.contentWindow;
  const out = [];
  const de = d.documentElement;

  // 1. Technical: does the page scroll sideways at all?
  if (de.scrollWidth > de.clientWidth + 1)
    out.push({ kind: "doc-overflow-x", detail: de.scrollWidth + ">" + de.clientWidth });

  const vw = de.clientWidth;
  for (const el of d.querySelectorAll("body *")) {
    const s = getComputedStyle(el);
    if (s.display === "none" || s.visibility === "hidden" || s.opacity === "0") continue;
    const r = el.getBoundingClientRect();
    if (r.width === 0 || r.height === 0) continue;

    const scrolled = inScroller(el, d.body);

    // 2. Technical: content wider than its own box, with no way to scroll it.
    if (!scrolled && el.scrollWidth > el.clientWidth + 1 && s.overflowX !== "auto" && s.overflowX !== "scroll" && s.overflowX !== "hidden")
      out.push({ kind: "clipped-content", el: describe(el), detail: el.scrollWidth + ">" + el.clientWidth });

    // 3. Visual: anything sticking out past the right edge of the viewport.
    // Skipped inside a horizontal scroller — that overflow is deliberate.
    if (!scrolled && r.right > vw + 1 && s.position !== "fixed")
      out.push({ kind: "past-right-edge", el: describe(el), detail: Math.round(r.right) + ">" + vw });

    // 4. Visual: sub-44px touch targets on touch-sized viewports.
    if (w <= 820 && (el.tagName === "BUTTON" || el.tagName === "A" || el.getAttribute("role") === "button")) {
      const isInline = s.display.includes("inline") && !s.display.includes("flex") && !s.display.includes("grid");
      // The inline exemption exists so a link inside a sentence is not flagged
      // for having the line's height — that is prose, not a tap target, and
      // flagging every one of them would be noise.
      //
      // But it was skipping STANDALONE controls that merely happen to be
      // display:inline: it let a 189x31 "Use a watch-only address" button pass
      // as clean. A control is only really inline if its parent has other text
      // around it; on its own it is a button that happens to be styled inline,
      // and a thumb does not care about the display property.
      const parent = el.parentElement;
      const siblingText = parent
        ? [...parent.childNodes].some((n) => n.nodeType === 3 && n.textContent.trim().length > 1)
        : false;
      const standalone = !isInline || !siblingText;
      if (standalone && (r.height < 36 || r.width < 24) && el.innerText.trim())
        out.push({ kind: "small-tap-target", el: describe(el), detail: Math.round(r.width) + "x" + Math.round(r.height) });
    }

    // 5. Visual: text too small to read on a phone.
    const fs = parseFloat(s.fontSize);
    if (w <= 430 && fs > 0 && fs < 9 && el.innerText && el.innerText.trim().length > 1 && el.children.length === 0)
      out.push({ kind: "tiny-text", el: describe(el), detail: fs + "px" });
  }

  // 6. Visual: fixed bottom chrome covering page content.
  const nav = d.querySelector(".bottom-nav");
  if (nav && getComputedStyle(nav).display !== "none") {
    const navTop = nav.getBoundingClientRect().top;
    const page = d.querySelector(".page");
    if (page) {
      const pb = parseFloat(getComputedStyle(page).paddingBottom);
      const navH = win.innerHeight - navTop;
      if (pb < navH) out.push({ kind: "nav-covers-content", detail: "pad " + Math.round(pb) + " < nav " + Math.round(navH) });
    }
  }

  // Collapse duplicates (a repeated row shouldn't report 40 times).
  const seen = new Map();
  for (const v of out) {
    const k = v.kind + "|" + (v.el || "");
    if (!seen.has(k)) seen.set(k, { ...v, count: 1 });
    else seen.get(k).count++;
  }
  return [...seen.values()];
}

// ── Document semantics ───────────────────────────────────────────────────
// Added after a scan found four routes — /, /portfolio, /marketplace and
// /dashboard-v2 — with ZERO headings of any level. Everything that looked like
// a heading was a styled div, so a screen reader had no outline to navigate
// and the page announced as one undifferentiated run of text.
//
// Heading presence is checked with a retry, because a heading rendered after a
// fetch resolves is absent at first paint and reporting that is a lie about
// the markup. /spreadcast tripped exactly this during development.
async function semantics() {
  const doc = stage.contentDocument, win = stage.contentWindow;
  const out = [];
  const vis = (el) => {
    const cs = win.getComputedStyle(el), r = el.getBoundingClientRect();
    return cs.display !== "none" && cs.visibility !== "hidden" && r.width > 0 && r.height > 0;
  };
  const headings = () => [...doc.querySelectorAll("h1,h2,h3,h4,h5,h6")].filter(vis);
  // Poll rather than wait a fixed beat. A single 1200ms retry was enough when
  // run alone and NOT enough during a 70-load sweep against a dev server that
  // compiles on demand — so it reported no-h1 for a page whose h1 was there.
  // An intermittently wrong check is worse than no check: it teaches you to
  // dismiss the finding, which is exactly what you must not do to a real one.
  let hs = headings();
  for (let waited = 0; waited < 5000 && !hs.some((h) => h.tagName === "H1"); waited += 250) {
    await new Promise((r) => setTimeout(r, 250));
    hs = headings();
  }
  const levels = hs.map((h) => +h.tagName[1]);
  const h1s = levels.filter((l) => l === 1).length;
  if (h1s === 0) out.push({ kind: "no-h1" });
  if (h1s > 1) out.push({ kind: "multiple-h1", detail: String(h1s) });
  for (let i = 1; i < levels.length; i++) {
    if (levels[i] - levels[i - 1] > 1) {
      out.push({ kind: "heading-level-skipped",
        detail: `h${levels[i - 1]} -> h${levels[i]} at "${hs[i].textContent.trim().slice(0, 26)}"` });
    }
  }
  if (!doc.querySelector("main")) out.push({ kind: "no-main-landmark" });
  if (!doc.documentElement.getAttribute("lang")) out.push({ kind: "no-lang" });
  // Several nav landmarks coexist here (main bar, mobile tabs, section bar).
  // Unlabelled they all announce as "navigation" and cannot be told apart.
  const navs = [...doc.querySelectorAll("nav")].filter(vis);
  if (navs.length > 1 && navs.some((n) => !n.getAttribute("aria-label"))) {
    out.push({ kind: "nav-landmark-unlabelled", detail: `${navs.length} <nav>` });
  }
  for (const el of doc.querySelectorAll("input,select,textarea")) {
    if (!vis(el)) continue;
    const lab = el.id ? doc.querySelector(`label[for="${CSS.escape(el.id)}"]`) : null;
    if (!(lab || el.closest("label") || el.getAttribute("aria-label") ||
          el.getAttribute("aria-labelledby") || el.getAttribute("placeholder"))) {
      out.push({ kind: "control-no-label", el: describe(el) });
    }
  }
  for (const el of doc.querySelectorAll("button,a[href],[role=button]")) {
    if (!vis(el)) continue;
    const n = (el.getAttribute("aria-label") || el.getAttribute("title") ||
      el.getAttribute("aria-labelledby") || el.textContent || "").trim();
    if (!n) out.push({ kind: "no-accessible-name", el: describe(el) });
  }
  for (const t of doc.querySelectorAll("table")) {
    if (!vis(t)) continue;
    const ths = [...t.querySelectorAll("th")];
    if (!ths.length) out.push({ kind: "table-no-th", el: describe(t) });
    else if (ths.some((th) => !th.getAttribute("scope"))) out.push({ kind: "th-no-scope", el: describe(t) });
  }
  const ids = {};
  for (const el of doc.querySelectorAll("[id]")) ids[el.id] = (ids[el.id] || 0) + 1;
  for (const k in ids) if (ids[k] > 1) out.push({ kind: "duplicate-id", detail: k });
  const seen = new Map();
  for (const v of out) { const k = v.kind + "|" + (v.el || v.detail || ""); if (!seen.has(k)) seen.set(k, v); }
  return [...seen.values()];
}

// ── Text contrast (WCAG 2.2 AA, 1.4.3) ──────────────────────────────────
// Added after a scan found 238 failing pieces of text across nine routes —
// every eyebrow, tile subtitle, table header and timestamp in the app — all
// of it invisible to the four "0 findings" audits that ran before this check
// existed. Layout being correct says nothing about whether it can be read.
//
// Resolves the real backdrop by walking ancestors and compositing any
// translucent layers, because almost nothing here sets its own opaque
// background; measuring against the element's own transparent one would score
// every element against black and pass everything.
function contrast() {
  const lin = (c) => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  const lum = ([r, g, b]) => 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
  const parse = (s) => {
    const m = (s || "").match(/rgba?\(([^)]+)\)/); if (!m) return null;
    const p = m[1].split(/[ ,\/]+/).filter(Boolean).map(Number);
    return { c: [p[0], p[1], p[2]], a: p.length > 3 ? p[3] : 1 };
  };
  const over = (f, b) => f.c.map((v, i) => v * f.a + b[i] * (1 - f.a));
  const win = stage.contentWindow, doc = stage.contentDocument;
  const backdrop = (el) => {
    let n = el, acc = null;
    while (n && n.nodeType === 1) {
      const b = parse(win.getComputedStyle(n).backgroundColor);
      if (b && b.a > 0) {
        if (b.a >= 1) return acc ? over(acc, b.c) : b.c;
        if (!acc) acc = b; else acc = { c: over(acc, b.c), a: Math.min(1, acc.a + b.a) };
      }
      n = n.parentElement;
    }
    return [3, 9, 7]; // --mw-carbon, the page's floor
  };
  const ratio = (a, b) => {
    const l1 = lum(a), l2 = lum(b);
    return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
  };
  const out = [];
  for (const el of doc.querySelectorAll("body *")) {
    // Own text only — otherwise a wrapper is credited with its children's text.
    const text = [...el.childNodes].filter((n) => n.nodeType === 3 && n.textContent.trim())
      .map((n) => n.textContent.trim()).join(" ");
    if (!text) continue;
    const cs = win.getComputedStyle(el);
    if (cs.visibility === "hidden" || cs.display === "none" || +cs.opacity === 0) continue;
    const r = el.getBoundingClientRect(); if (!r.width || !r.height) continue;
    const fg = parse(cs.color); if (!fg) continue;
    const bg = backdrop(el);
    const cr = ratio(fg.a < 1 ? over(fg, bg) : fg.c, bg);
    const fs = parseFloat(cs.fontSize), fw = +cs.fontWeight || 400;
    const need = fs >= 24 || (fs >= 18.66 && fw >= 700) ? 3 : 4.5; // AA large-text carve-out
    if (cr < need) {
      out.push({ kind: "contrast-below-aa", el: describe(el),
        detail: `${cr.toFixed(2)}:1 needs ${need} — ${fs}px/${fw} "${text.slice(0, 30)}"` });
    }
  }
  const seen = new Map();
  for (const v of out) if (!seen.has(v.el)) seen.set(v.el, v);
  return [...seen.values()];
}

window.runAudit = async function (routes, widths) {
  routes = routes || ROUTES; widths = widths || WIDTHS;
  const findings = [];
  let n = 0, total = routes.length * widths.length;
  for (const route of routes) {
    for (const w of widths) {
      hud.textContent = `auditing ${++n}/${total}  ${route} @ ${w}`;
      await load(route, w, HEIGHTS[w] || 800);
      let res = [];
      try { res = audit(w); } catch (e) { res = [{ kind: "audit-error", detail: String(e).slice(0, 90) }]; }
      for (const r of res) findings.push({ route, w, ...r });
      // Contrast only needs measuring once per route — it does not vary with
      // width — so run it on the first pass and skip the other six.
      if (w === widths[0]) {
        let cr = [];
        try { cr = contrast(); } catch (e) { cr = [{ kind: "contrast-error", detail: String(e).slice(0, 90) }]; }
        for (const r of cr) findings.push({ route, w, ...r });
        let sem = [];
        try { sem = await semantics(); } catch (e) { sem = [{ kind: "semantics-error", detail: String(e).slice(0, 90) }]; }
        for (const r of sem) findings.push({ route, w, ...r });
      }
    }
  }
  // A rotated phone, which no width-keyed sweep can reach.
  hud.textContent = "auditing short viewports…";
  try {
    for (const f of await auditShortViewports(routes.slice(0, 6))) findings.push(f);
  } catch (e) {
    findings.push({ route: "(landscape)", w: 0, kind: "short-viewport-audit-error", detail: String(e).slice(0, 90) });
  }

  // Overlays, at the width where they are most constrained.
  hud.textContent = "auditing overlays…";
  try {
    for (const f of await auditOverlays(390)) findings.push(f);
  } catch (e) {
    findings.push({ route: "(overlays)", w: 390, kind: "overlay-audit-error", detail: String(e).slice(0, 90) });
  }

  // Run the value check as part of every audit, so it cannot be forgotten.
  hud.textContent = "validating CSS values…";
  let css = { checked: 0, invalid: 0, samples: [] };
  try { css = await window.validateCss(); } catch (e) { css.samples = [String(e).slice(0, 80)]; }
  for (const s of css.samples) findings.push({ route: "(stylesheet)", w: 0, kind: "invalid-css-value", detail: s });
  // "0 invalid of 0 checked" is not a pass, it is a check that did not run —
  // which is exactly what a silent instrument failure looks like. Called on
  // its own before any route has loaded, validateCss finds no stylesheets and
  // reports a clean zero. Say so out loud instead.
  if (!css.checked) {
    findings.push({ route: "(stylesheet)", w: 0, kind: "css-check-did-not-run",
      detail: "0 declarations reachable — load a route first, then re-run" });
  }

  hud.textContent = `done — ${findings.length} findings (${css.checked} css decls checked)`;
  window.LAST = findings; // stored in the page's own scope so it survives
  window.LAST_CSS = css;
  return findings;
};

// ── CSS value validity ───────────────────────────────────────────────────
// A declaration with an invalid VALUE is not a syntax error — the browser
// silently drops it and the element falls back to its inherited style. Nothing
// else here catches that: the build does not validate values, and an element
// inheriting a larger size rarely overflows. This is exactly how 40 corrupted
// font-size rules survived three clean audit runs.
//
// Fetches the real stylesheets the app loaded and asks CSS.supports() about
// every declaration.
window.validateCss = async function () {
  const doc = stage.contentDocument;
  const hrefs = [...doc.querySelectorAll('link[rel="stylesheet"]')].map((l) => l.href);
  const bad = [];
  let checked = 0;

  for (const href of hrefs) {
    let text = "";
    try { text = await fetch(href).then((r) => r.text()); } catch { continue; }
    // @font-face carries DESCRIPTORS (unicode-range, font-display, and a
    // variable-font "font-weight: 100 900" range) that CSS.supports() rejects
    // because they are not properties. Strip those blocks or they drown the
    // real findings — 40 false positives on this app alone.
    const clean = text
      .replace(/\/\*[\s\S]*?\*\//g, "")
      .replace(/@font-face\s*\{[^}]*\}/g, "")
      .replace(/@(counter-style|property|font-feature-values)[^{]*\{[^}]*\}/g, "");
    for (const m of clean.matchAll(/([-a-zA-Z]+)\s*:\s*([^;{}]+)(?=[;}])/g)) {
      const prop = m[1].trim();
      // CSS.supports() takes a property and a value — not a priority — so the
      // !important suffix has to come off or every guarded rule reads invalid.
      const val = m[2].trim().replace(/\s*!\s*important$/i, "");
      if (!prop || !val) continue;
      if (prop.startsWith("--")) continue;           // custom props accept anything
      if (prop.startsWith("-")) continue;            // vendor prefixes are normalised away
      if (/^(from|to|src)$/.test(prop)) continue;    // keyframe selectors / font-face
      checked++;
      let ok = false;
      try { ok = CSS.supports(prop, val); } catch { ok = true; }
      if (!ok && bad.length < 40) bad.push(`${prop}: ${val}`);
    }
  }
  return { checked, invalid: bad.length, samples: bad };
};

// Compact report: unique issue per (kind, element, route), with the widths it
// appeared at. Called separately once runAudit has finished.
window.report = function () {
  const f = window.LAST || [];
  const byKind = {};
  const uniq = new Map();
  for (const x of f) {
    byKind[x.kind] = (byKind[x.kind] || 0) + 1;
    const k = x.kind + "|" + (x.el || "") + "|" + x.route;
    if (!uniq.has(k)) uniq.set(k, { kind: x.kind, el: x.el, route: x.route, detail: x.detail, w: [x.w] });
    else uniq.get(k).w.push(x.w);
  }
  return { total: f.length, unique: uniq.size, byKind, issues: [...uniq.values()] };
};
</script>
